<html>

<H2>

   <meta charset="utf-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
   <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
   <script src="https://unpkg.com/esri-leaflet@2.5.3/dist/esri-leaflet.js"></script>
   


</head>
<body>
   <div id="map" style="height: 850px;"></div>
   <script src="places-geojson.js" type="text/javascript"></script>
   <script>
       var map = L.map('map').setView([58.845017, 25.548706], 8);
       L.esri.basemapLayer('Topographic').addTo(map);
	
	const eesti_icon = L.icon({
		iconUrl: 'flag_of_Estonia.png',
		iconSize: [25, 20],
		iconAnchor: [18, 20],
		popupAnchor: [0, -28]
	});	
	
	const tallinn = L.marker([59.433765, 24.744194],{icon: eesti_icon}).addTo(map)
		.bindPopup('<b>Tallinn Vabaduse väljak  - Freedom Square<br><a href="../help.html">Abi -- Help</b></a><br>');
	
	const popup = L.popup();

	var googlelink = "";
	var coords = "";
	var link ="";
	var url ="";
	
	// add OpenStreetMap links, like https://www.openstreetmap.org/search?query=39.818232%2C+-77.280064&zoom=13
      map.on('click', function(e) {
	     coords = e.latlng.toString().substring(7,e.latlng.toString().length-1);
		 url = 'https://www.google.com/maps/place/' + coords;
		 link = '<a href="' + url + '" >Google maps link</a>';
		 googlelink = coords + '<br>' + link;
		 
		 opencoords = coords.replace(' ','');
		 openurl = 'https://www.openstreetmap.org/search?query=' + opencoords + '#map=16';
	     openlink = '<a href="' + openurl + '" >OpenStreetMap link</a>';
		 
		 bingcoords = coords.replace(', ','~');
		 bingurl = 'https://www.bing.com/maps/search?cp=' + bingcoords + '&lvl=15';
	     binglink = '<a href="' + bingurl + '" >Bing maps link</a>';

		
      });
	
	function onMapClick(e) {
		popup
			.setLatLng(e.latlng)
			.setContent(googlelink + '<br>' + binglink + '<br>' + openlink )
			.openOn(map)
	}

	map.on('click', onMapClick);
	
		const knightsicon = L.icon({
		iconUrl: 'livonian_cross_q.bmp',
		iconSize: [20, 25],
		iconAnchor: [18, 20],
		popupAnchor: [0, -28]
	});
	
	function onEachFeature(feature, layer) {
    // does this feature have a property named popupContent?
    if (feature.properties && feature.properties.popupContent) {
        layer.bindPopup(feature.properties.popupContent);
    }
}

	
	const knightsicon_true = L.icon({
		iconUrl: 'livonian_cross_plain.bmp',
		iconSize: [20, 25],
		iconAnchor: [18, 20],
		popupAnchor: [0, -28]
	});	
	
	var knightsLayer = L.geoJSON(knights, {
		pointToLayer(feature, latlng) {
			return L.marker(latlng, {icon: knightsicon});
		},
		onEachFeature
	}).addTo(map);
	
	var knightsLayer_true = L.geoJSON(knights_true, {
		pointToLayer(feature, latlng) {
			return L.marker(latlng, {icon: knightsicon_true});
		},
		onEachFeature
	}).addTo(map);

	
	const kunglaicon = L.icon({
		iconUrl: 'sweden_flag.bmp',
		iconSize: [25, 20],
		iconAnchor: [18, 20],
		popupAnchor: [0, -28]
	});
	
	var kunglaLayer = L.geoJSON(kungla, {
		pointToLayer(feature, latlng) {
			return L.marker(latlng, {icon: kunglaicon});
		},
		onEachFeature
	}).addTo(map);

	const exactLayer = L.geoJSON([exactloc], {
		style(feature) {
			return feature.properties && feature.properties.style;
		},
		onEachFeature,
		pointToLayer(feature, latlng) {
			return L.circleMarker(latlng, {
				radius: 4,
				fillColor: 'white',
				color: 'blue',
				weight: 2,
				opacity: 5,
				fillOpacity: 0.2
			});
		}
	}).addTo(map);
	
	const squareLayer = L.geoJSON(square, {

		filter(feature, layer) {
			if (feature.properties) {
				// If the property "underConstruction" exists and is true, return false (don't render features under construction)
				return feature.properties.underConstruction !== undefined ? !feature.properties.underConstruction : true;
			}
			return false;
		},

		onEachFeature
	}).addTo(map);



		
   </script>
</body>
</html>
