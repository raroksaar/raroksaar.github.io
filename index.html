<div id="map" style="width: 1200px; height: 800px;"></div>
<script src="places-geojson.js" type="text/javascript"></script>

<script>
	const map = L.map('map').setView([58.845017, 25.548706], 8);
	const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
		maxZoom: 19,
		attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
	}).addTo(map);

	//const inputValue = document.getElementById("loc").innerHTML;
	const inputValue = "59.434358,24.742334";
	
	var tallinn = L.marker([59.434358,24.742334]).addTo(map)
		.bindPopup('<b>Tallinn</b><br />');
		
	const popup = L.popup()
		.setLatLng([59.434358,24.742334])
		.setContent('Old Town.');
		//.openOn(map);

	function onMapClick(e) {
		popup
			.setLatLng(e.latlng)
			.setContent(`You clicked the map at ${e.latlng.toString()}`)
			.openOn(map);
	}


	var googlelink = "";
	var coords = "";
	var link ="";
	var url ="";
      map.on('click', function(e) {
	     coords = e.latlng.toString().substring(7,e.latlng.toString().length-1);
		 url = 'https://www.google.com/maps/place/' + coords;
		 link = '<a href="' + url + '" >Google maps link</a>';
		 googlelink = coords + '<br>' + link;
      });
	
	// https://www.bing.com/maps/search?cp=58.807308%7E25.674388&lvl=11 -
	//https://www.bing.com/maps/search?cp=58.807308%7E25.674388&lvl=11&style=r
	
	var binglink = "";
	//var coords = ""; replkace comma with %7E
	var link ="";
	var bingurl ="";
	var bingcoords = coords.replace(', ', '~');
      map.on('click', function(e) {
	     //coords = e.latlng.toString().substring(7,e.latlng.toString().length-1);
		 
		 bingurl = 'https://www.bing.com/maps/search?cp=' + bingcoords;
		 binglink = '<a href="' + bingurl + '" >Bing maps link</a>';
		// binglink = link;
      });
	
	function onMapClick(e) {
		popup
			.setLatLng(e.latlng)
			.setContent(googlelink + '<br>' + coords )
			//.setContent(`You clicked the map at:<br> (${e.latlng.toString()}<br>=====`)
			.openOn(map)
	}
	map.on('click', onMapClick);


function onEachFeature(feature, layer) {
    // does this feature have a property named popupContent?
    if (feature.properties && feature.properties.popupContent) {
        layer.bindPopup(feature.properties.popupContent);
    }
}

	const approximateLayer = L.geoJSON([approximate], {
		style(feature) {
			return feature.properties && feature.properties.style;
		},

		onEachFeature,

		pointToLayer(feature, latlng) {
			return L.circleMarker(latlng, {
				radius: 7,
				fillColor: 'white',
				color: 'black',
				weight: 2,
				opacity: 5,
				fillOpacity: 0.2
			});
		}
	}).addTo(map);
	
	const exactLayer = L.geoJSON([exactloc], {
		style(feature) {
			return feature.properties && feature.properties.style;
		},

		onEachFeature,

		pointToLayer(feature, latlng) {
			return L.circleMarker(latlng, {
				radius: 4,
				fillColor: 'white',
				color: 'blue',
				weight: 2,
				opacity: 5,
				fillOpacity: 0.2
			});
		}
	}).addTo(map);
	
	const squareLayer = L.geoJSON(square, {

		filter(feature, layer) {
			if (feature.properties) {
				// If the property "underConstruction" exists and is true, return false (don't render features under construction)
				return feature.properties.underConstruction !== undefined ? !feature.properties.underConstruction : true;
			}
			return false;
		},

		onEachFeature
	}).addTo(map);
	


	const knightsicon = L.icon({
		iconUrl: 'livonian_cross_q.bmp',
		iconSize: [20, 25],
		iconAnchor: [18, 20],
		popupAnchor: [0, -28]
	});
	
	var knightsLayer = L.geoJSON(knights, {
		pointToLayer(feature, latlng) {
			return L.marker(latlng, {icon: knightsicon});
		},
		onEachFeature
	}).addTo(map);

	
	const kunglaicon = L.icon({
		iconUrl: 'sweden_flag.bmp',
		iconSize: [25, 20],
		iconAnchor: [18, 20],
		popupAnchor: [0, -28]
	});
	
	var kunglaLayer = L.geoJSON(kungla, {
		pointToLayer(feature, latlng) {
			return L.marker(latlng, {icon: kunglaicon});
		},
		onEachFeature
	}).addTo(map);



</script>
